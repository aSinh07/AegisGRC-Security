name: AegisGRC CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_ci
          POSTGRES_DB: aegisgrc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegisgrc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aegis:aegis_ci@localhost:5432/aegisgrc
      PGSSL: disable
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript build check
        run: npm run build
      - name: Test
        # Integration test files share this job's single PostgreSQL service. Run files
        # serially so independent schema/runtime initializers cannot deadlock each other.
        # This preserves the complete test suite and every assertion.
        run: node --test --test-concurrency=1 --import tsx tests/*.test.ts
      - name: Concurrent runtime and graceful-shutdown smoke
        run: |
          set -euo pipefail
          node --import tsx src/server.ts >/tmp/aegis-runtime.log 2>&1 &
          pid=$!
          cleanup(){ kill -TERM "$pid" >/dev/null 2>&1 || true; wait "$pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8080/api/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/ready >/dev/null || { cat /tmp/aegis-runtime.log; exit 1; }
          AEGIS_LOAD_URL=http://127.0.0.1:8080/api/ready AEGIS_LOAD_REQUESTS=500 AEGIS_LOAD_CONCURRENCY=25 AEGIS_LOAD_MAX_SECONDS=20 bash scripts/verify-load-smoke.sh
          kill -TERM "$pid"
          for i in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then cat /tmp/aegis-runtime.log; echo "Server did not drain after SIGTERM"; exit 1; fi
          wait "$pid" || { cat /tmp/aegis-runtime.log; exit 1; }
          trap - EXIT
