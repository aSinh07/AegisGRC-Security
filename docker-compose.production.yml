services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegis", "-d", "aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - aegis-db:/var/lib/postgresql/data

  aegis:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.wapiti
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s

volumes:
  aegis-db:
    name: aegisgrc-security_aegis-db
    external: true
