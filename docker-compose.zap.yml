services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=false
      - -config
      - api.key=${ZAP_API_KEY}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    expose:
      - "8080"
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY}
    volumes:
      - zap-data:/home/zap/.ZAP
    restart: unless-stopped

  aegis:
    environment:
      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY}
    depends_on:
      - zap

volumes:
  zap-data:
