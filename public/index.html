<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AegisGRC Security</title><style>
body{font-family:system-ui;background:#07111f;color:#e5eef9;margin:0}.wrap{max-width:1000px;margin:50px auto;padding:24px}.card{background:#0d1b2d;border:1px solid #203550;border-radius:16px;padding:20px;margin:14px 0}input,select,button{padding:12px;border-radius:9px;border:1px solid #345;background:#081421;color:white}input{width:65%}button{cursor:pointer;background:#0e7490}pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:#030914;padding:16px;border-radius:12px}.ok{color:#67e8f9}.warn{color:#fbbf24}
</style></head><body><div class="wrap"><h1>AegisGRC Security</h1><p>Authorized assessment workspace — real evidence only.</p>
<div class="card" id="gate"><h2>1. Authorize assessment scope</h2><input id="target" placeholder="https://your-authorized-target.example"><label><input id="auth" type="checkbox" style="width:auto"> I own this target or have explicit permission to assess it.</label><br><br><button onclick="authorize()">Enter assessment</button><p id="gateStatus"></p></div>
<div class="card" id="workspace" hidden><h2>2. Real scanner workspace</h2><p id="scope" class="ok"></p><select id="tool"><option value="nmap">Nmap — real</option><option value="wapiti">Wapiti — real</option></select> <button onclick="scan()">Run authorized scan</button> <button onclick="report()">View GRC report</button><p>Burp / Metasploit / Wireshark are not represented as active unless a genuine provider is connected. Semgrep belongs to source-repository assessment.</p><pre id="out">Ready.</pre></div>
</div><script>
let authorized=false, assessmentId=null;
async function authorize(){const targetUrl=document.getElementById('target').value;const authorizedBox=document.getElementById('auth').checked;const r=await fetch('/api/assessment/authorize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetUrl,authorized:authorizedBox})});const d=await r.json();document.getElementById('gateStatus').textContent=d.error||'Authorized: '+d.targetOrigin;if(r.ok){authorized=true;assessmentId=d.assessmentId;document.getElementById('workspace').hidden=false;document.getElementById('scope').textContent='Scope: '+d.targetOrigin+' | IP: '+d.resolvedAddresses.join(', ')}}
async function scan(){if(!authorized)return;const targetUrl=document.getElementById('target').value,tool=document.getElementById('tool').value,out=document.getElementById('out');out.textContent='Running REAL '+tool+' process...';const r=await fetch('/api/scans/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetUrl,tool,authorized:true,assessmentId})});const d=await r.json();out.textContent=d.error||['Execution: '+d.execution,'Tool: '+d.tool,'Exit: '+d.exitCode,'Duration: '+d.durationMs+' ms','Evidence SHA-256: '+d.evidence.sha256,'','STDOUT:',d.stdout,'','STDERR:',d.stderr].join('\n')}
async function report(){if(!assessmentId)return;const r=await fetch('/api/assessments/'+assessmentId+'/report');const d=await r.json();document.getElementById('out').textContent=JSON.stringify(d,null,2)}
</script></body></html>
