services:
  - type: web
    name: aegisgrc-security
    runtime: docker
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: ASSESSMENT_SESSION_SECRET
        generateValue: true
      - key: EVIDENCE_HMAC_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PGSSL
        value: require
